name: Evaluate
run-name: ${{ inputs.label }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      label:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: runner-bundle
          path: bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: shard-*
          path: recovered
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - id: plan
        run: python ci/recover_split.py plan
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: runner-bundle
          path: bundle/
          retention-days: 7
  recover:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/download-artifact@v8.0.2
        if: matrix.part == -1
        with:
          name: shard-${{ matrix.shard }}
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.2
        if: matrix.part != -1
        with:
          name: runner-bundle
          path: bundle
      - name: Recover ten original seeds
        if: matrix.part != -1
        run: python ci/recover_split.py part --shard ${{ matrix.shard }} --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: recovered-${{ matrix.shard }}-${{ matrix.part }}
          path: out/
          if-no-files-found: error
          retention-days: 7
  summarize:
    needs: [plan, recover]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: recovered-*
          path: recovered
      - run: python ci/recover_split.py merge
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: evaluation-summary
          path: results/
          if-no-files-found: error
          retention-days: 7
