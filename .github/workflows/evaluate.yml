name: Evaluate
run-name: ${{ inputs.label }}
on:
  workflow_dispatch:
    inputs:
      label:
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            ci
            recovery-inputs
      - run: python -m zipfile -e recovery-inputs/frozen.zip .
      - id: plan
        run: python ci/accelerate.py matrix
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: runner-bundle
          path: bundle/
          retention-days: 7
  simulate:
    needs: plan
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: runner-bundle
          path: bundle
      - run: python ci/accelerate.py part --shard ${{ matrix.shard }} --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: piece-${{ matrix.shard }}-${{ matrix.part }}
          path: out/
          if-no-files-found: error
          retention-days: 7
