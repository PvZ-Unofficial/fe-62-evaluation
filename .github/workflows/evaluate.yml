name: Evaluate
run-name: ${{ inputs.label }} 路 ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      request:
        description: Committed JSON request containing 300 unique seeds
        required: true
        default: requests/cloud-baseline.json
      label:
        description: Human-readable experiment name
        required: true
        default: cloud-baseline
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: runner-bundle
          path: bundle
          run-id: 41113191997
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: runner-bundle
          path: bundle/
          retention-days: 7
  simulate:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - id: previous
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          name: shard-${{ matrix.shard }}
          path: recovered
          run-id: 41113191997
          github-token: ${{ github.token }}
      - name: Keep validated old shard
        if: steps.previous.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path outputs | Out-Null
          Copy-Item -LiteralPath recovered -Destination outputs/shard-${{ matrix.shard }} -Recurse
      - uses: actions/download-artifact@v8.0.2
        if: steps.previous.outcome != 'success'
        with:
          name: runner-bundle
          path: bundle
      - name: Run 50 independent roots with 4 workers
        if: steps.previous.outcome != 'success' 
        run: python ci/evaluate.py shard --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: outputs/shard-${{ matrix.shard }}/
          retention-days: 7
          if-no-files-found: error
  summarize:
    needs: [build, simulate]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: shard-*
          path: outputs
      - name: Validate all 300 roots and summarize
        run: python ci/evaluate.py summarize
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: evaluation-summary
          path: results/
          retention-days: 7
          if-no-files-found: error
